<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Builder - Densanon Toolkit</title>
  <meta name="description" content="Chain tools together visually — connect image processors, data converters, and more into automated workflows.">
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    /* ── Layout ── */
    .pl-workspace {
      display: flex;
      height: calc(100vh - 130px);
      min-height: 500px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 8px;
    }

    /* ── Toolbar ── */
    .pl-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
    }
    .pl-toolbar-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
      margin-right: auto;
    }
    .pl-toolbar .pl-btn {
      padding: 7px 16px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pl-toolbar .pl-btn:hover {
      background: var(--color-surface-hover);
    }
    .pl-toolbar .pl-btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
      font-weight: 600;
    }
    .pl-toolbar .pl-btn-primary:hover {
      background: var(--color-primary-hover);
    }
    .pl-toolbar .pl-btn-primary.running {
      background: var(--color-accent-orange);
      border-color: var(--color-accent-orange);
    }

    /* ── Sidebar ── */
    .pl-sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      padding: 12px;
    }
    .pl-sidebar h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin: 14px 0 6px;
      padding: 0;
    }
    .pl-sidebar h4:first-child { margin-top: 0; }
    .pl-palette-node {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--color-text);
      cursor: grab;
      transition: background 0.12s;
      user-select: none;
    }
    .pl-palette-node:hover {
      background: var(--color-surface-hover);
    }
    .pl-palette-icon { margin-right: 2px; }

    /* ── Canvas ── */
    .pl-canvas-container {
      flex: 1;
      overflow: auto;
      position: relative;
    }
    .pl-canvas {
      position: relative;
      min-width: 2000px;
      min-height: 1500px;
      background-image:
        radial-gradient(circle, var(--color-border) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .pl-connections {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
    .pl-conn {
      stroke: var(--color-text-muted);
      transition: stroke 0.15s;
      pointer-events: none;
    }
    .pl-conn.selected {
      stroke: var(--color-primary);
      stroke-width: 3;
    }
    .pl-conn-hit {
      pointer-events: stroke;
    }

    /* ── Nodes ── */
    .pl-node {
      position: absolute;
      width: 220px;
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 10px;
      z-index: 2;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .pl-node.dragging { z-index: 100; opacity: 0.9; }
    .pl-node.state-running { border-color: var(--color-accent-blue); }
    .pl-node.state-done { border-color: var(--color-accent-green); }
    .pl-node.state-error { border-color: var(--color-primary); }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(96, 165, 250, 0); }
    }
    .pl-node.state-running { animation: pulse-border 1.2s ease-in-out infinite; }

    .pl-node-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--color-border);
      border-radius: 8px 8px 0 0;
      cursor: grab;
      user-select: none;
    }
    .pl-node-icon { font-size: 1rem; }
    .pl-node-title {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .pl-node-delete {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 2px;
      line-height: 1;
    }
    .pl-node-delete:hover { color: var(--color-primary); }

    /* ── Ports ── */
    .pl-node-ports { padding: 6px 0; }
    .pl-port {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      color: var(--color-text-muted);
    }
    .pl-port-in { flex-direction: row; }
    .pl-port-out { flex-direction: row; justify-content: flex-end; }
    .pl-port-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background: var(--color-bg);
      cursor: crosshair;
      transition: border-color 0.12s, background 0.12s;
      flex-shrink: 0;
      z-index: 5;
    }
    .pl-port-dot:hover {
      border-color: var(--color-text);
      background: var(--color-surface-hover);
    }
    .pl-port-dot.type-image { border-color: var(--color-primary); }
    .pl-port-dot.type-image:hover { background: var(--color-primary); }
    .pl-port-dot.type-text { border-color: var(--color-accent-blue); }
    .pl-port-dot.type-text:hover { background: var(--color-accent-blue); }
    .pl-port-dot.type-imagearray { border-color: var(--color-accent-orange); }
    .pl-port-dot.type-imagearray:hover { background: var(--color-accent-orange); }
    .pl-port-dot.type-any { border-color: var(--color-accent-green); }
    .pl-port-dot.type-any:hover { background: var(--color-accent-green); }

    /* ── Node Config ── */
    .pl-node-config {
      padding: 4px 10px 6px;
      border-top: 1px solid var(--color-border);
    }
    .pl-cfg-label {
      display: block;
      font-size: 0.72rem;
      color: var(--color-text-muted);
      margin: 4px 0 2px;
    }
    .pl-cfg-input {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 0.78rem;
      margin-top: 2px;
    }
    .pl-cfg-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    select.pl-cfg-input {
      cursor: pointer;
    }
    input[type="range"].pl-cfg-input {
      padding: 0;
      border: none;
      background: none;
    }
    .pl-cfg-val {
      float: right;
      color: var(--color-text);
      font-weight: 600;
    }
    .pl-cfg-file {
      display: none;
    }
    .pl-cfg-filename {
      display: block;
      padding: 5px 8px;
      border: 1px dashed var(--color-border);
      border-radius: 4px;
      font-size: 0.78rem;
      color: var(--color-text-muted);
      cursor: pointer;
      text-align: center;
      margin-top: 2px;
      transition: border-color 0.15s;
    }
    .pl-cfg-filename:hover {
      border-color: var(--color-primary);
      color: var(--color-text);
    }
    .pl-cfg-textarea {
      resize: vertical;
      min-height: 48px;
      font-family: monospace;
    }

    /* ── Node Status ── */
    .pl-node-status {
      font-size: 0.72rem;
      color: var(--color-primary);
      padding: 0 10px 6px;
      min-height: 0;
    }
    .pl-node-status:empty { display: none; }

    /* ── Status Bar ── */
    .pl-status {
      font-size: 0.82rem;
      color: var(--color-text-muted);
      min-height: 1.2em;
    }
    .pl-status.success { color: var(--color-accent-green); }
    .pl-status.error { color: var(--color-primary); }
    .pl-status.info { color: var(--color-accent-blue); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .pl-sidebar { width: 160px; min-width: 160px; }
      .pl-node { width: 180px; }
    }
  </style>
</head>
<body>
<nav class="breadcrumb" aria-label="Breadcrumb"></nav>
<main class="container" style="max-width:100%; padding:0 16px;">

  <div class="pl-toolbar" id="plToolbar">
    <span class="pl-toolbar-title">Pipeline Builder</span>
    <span class="pl-status" id="plStatusBar"></span>
    <button class="pl-btn" id="plSave">Save</button>
    <button class="pl-btn" id="plLoad">Load</button>
    <button class="pl-btn" id="plClear">Clear</button>
    <button class="pl-btn pl-btn-primary" id="plRun">Run Pipeline</button>
  </div>

  <div class="pl-workspace">
    <aside class="pl-sidebar" id="plSidebar"></aside>
    <div class="pl-canvas-container">
      <div class="pl-canvas" id="plCanvas">
        <svg class="pl-connections" id="plConnections"></svg>
      </div>
    </div>
  </div>

</main>

<script src="../../../js/page-consistency.js"></script>
<script>
  initPage({
    depth: 3,
    activeCategory: 'developer-tools',
    title: 'Pipeline Builder',
    breadcrumbs: [
      { label: 'Developer Tools', href: '../index.html' },
      { label: 'Pipeline Builder' }
    ]
  });
</script>
<script src="../../../js/pipeline-engine.js"></script>
<script src="../../../js/pipeline-nodes.js"></script>
<script src="../../../js/pipeline-editor.js"></script>
<script>
  PipelineEditor.init({
    canvas: 'plCanvas',
    svg: 'plConnections',
    sidebar: 'plSidebar',
    toolbar: 'plToolbar',
    status: 'plStatusBar'
  });

  // File input click-through for file upload nodes
  document.getElementById('plCanvas').addEventListener('click', function (e) {
    var display = e.target.closest('.pl-cfg-filename');
    if (display) {
      var label = display.closest('label');
      var fileInput = label ? label.querySelector('input[type="file"]') : null;
      if (fileInput) fileInput.click();
    }
  });
</script>
</body>
</html>
